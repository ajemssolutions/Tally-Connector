name: Build and publish installer

# Push a version tag (v2.0.1) to start a release, or run it by hand to test a build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  # ---------------------------------------------------------------- build
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the Windows installer
        run: npx electron-builder --win --publish never

      # dist/ now holds:  Tally Connector Setup <version>.exe
      #                   latest.yml          <- the update feed
      #                   *.blockmap          <- lets updates download only what changed
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

  # ------------------------------------------- GitHub release (public link)
  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - name: Attach the installer to a release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            ## Tally Connector - Windows installer

            Download **Tally Connector Setup .exe** below and run it. Nothing else to install.

            Windows may show a SmartScreen warning the first time because the app is
            not code-signed - click **More info** then **Run anyway**.

            ### After installing
            1. Open Tally Prime with your company loaded
               (F1 > Settings > Connectivity > Client/Server configuration > acts as "Both")
            2. Open Tally Connector, enter your AJEMS organisation name and secret key
            3. Click **AJEMS Connect**, then **Run Sync**

  # ------------------------------------------------------- publish (gated)
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Add a required reviewer under Settings > Environments > production and
    # GitHub will wait for your approval before anything reaches the server.
    environment: production
    steps:
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - name: Upload to the download server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Folder on the server, e.g. public_html/downloads/tally-connector
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "No download server configured yet - skipping upload."
            echo "The installer is still available under Artifacts on this run."
            exit 0
          fi

          upload() {
            echo "Uploading: $(basename "$1")"
            curl --fail --silent --show-error --ftp-create-dirs \
                 --ftp-ssl -k \
                 -T "$1" -u "$FTP_USER:$FTP_PASSWORD" \
                 "ftp://$FTP_HOST/$FTP_PATH/$(basename "$1")"
          }

          # Installer and blockmap first, then the feed - so clients never see a
          # latest.yml pointing at a file that has not finished uploading.
          for f in dist/*.exe dist/*.blockmap; do
            [ -e "$f" ] && upload "$f"
          done
          upload dist/latest.yml

          # A second copy under a fixed name, so the link you give customers
          # never changes when the version does.
          SETUP=$(ls dist/*.exe | head -1)
          cp "$SETUP" "dist/TallyConnectorSetup.exe"
          upload "dist/TallyConnectorSetup.exe"

          echo "Done. Users will see the update within six hours, or on next launch."